[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-backend"
version = "2.0.0"
description = "Multi-Agent Operations Engine backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "python-multipart>=0.0.12",
    "ddgs>=9.16.0",
    "httpx>=0.27.2",
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "E712", # comparison to False/True (needed for SQLAlchemy binary expressions)
    "E741", # ambiguous variable name l
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
python_files = ["test_*.py"]
